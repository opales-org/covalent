# The errors shown when a saved view cannot be renamed or read. {0}, {1}... are filled in; no apostrophe escaping is needed.
error.nameTaken=A view named "{0}" already exists for {1}.
error.missing=Not a view file: no {0} in {1}.
error.invalid=Unreadable view file: invalid {0} in {1}.
error.newer=This view file comes from a newer version of the supervisor: {0}.
